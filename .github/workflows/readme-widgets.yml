name: Refresh README widgets

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: readme-widgets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and sanitize widgets
        run: |
          python3 scripts/fetch-all-widgets.py

      - name: Fetch repo and follower counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch-profile-stats.py

      - name: Fetch contribution activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch-activity.py

      - name: Render highlights panel
        # Reads the refreshed widgets; a failure must not block the widget refresh.
        continue-on-error: true
        run: |
          pip install fonttools
          python3 scripts/generate_highlights.py

      - name: Render activity graph
        # Same contract as the highlights panel: it only reads files, and must not block the commit.
        continue-on-error: true
        run: |
          pip install fonttools
          python3 scripts/generate_activity.py

      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg assets/profile-stats.json assets/highlights.svg assets/activity.json assets/activity-graph.svg
          git commit -m "Refresh dynamic README widgets" || exit 0
          git pull --rebase origin main
          git push
