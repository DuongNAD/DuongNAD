name: Refresh README activity

# Once a day: fetch the last month of contributions and redraw the activity graph in both
# GitHub themes. Everything else in the README is static art from scripts/generate_banner.py.

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: readme-widgets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fontTools
        run: pip install fonttools==4.63.0

      - name: Fetch contribution activity
        # Keeps the existing assets/activity.json when the API call fails.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch-activity.py

      - name: Render activity graph
        run: python3 scripts/generate_activity.py

      - name: Check the profile
        # A broken graph is never committed.
        run: python3 -m unittest discover -v tests

      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/activity.json assets/activity-dark.svg assets/activity-light.svg
          git commit -m "Refresh activity graph" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
