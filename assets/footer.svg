<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="100%" height="90" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05120f" />
      <stop offset="50%" stop-color="#0b241e" />
      <stop offset="100%" stop-color="#05120f" />
    </linearGradient>

    <linearGradient id="leaf-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05120f" />
      <stop offset="20%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#05120f" />
    </linearGradient>

    <style>
      .quote-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-style: italic;
        fill: #d1fae5;
        letter-spacing: 0.5px;
      }
      .author-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        fill: #6ee7b7;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Clean rounded background -->
  <rect width="1200" height="90" rx="10" fill="url(#footer-bg)" stroke="#134236" stroke-width="1" stroke-opacity="0.5" />
  
  <!-- Subtle organic divider line -->
  <line x1="80" y1="12" x2="1120" y2="12" stroke="url(#leaf-accent)" stroke-width="1.2" />

  <!-- Nature Leaf Emblem in Center -->
  <g transform="translate(600, 12) scale(0.7)">
    <path d="M 0 -8 C 6 -4, 8 2, 0 8 C -8 2, -6 -4, 0 -8 Z" fill="#34d399" opacity="0.9" />
    <line x1="0" y1="-5" x2="0" y2="6" stroke="#064e3b" stroke-width="1" />
  </g>

  <!-- Quote & Signature -->
  <g text-anchor="middle">
    <text x="600" y="45" class="quote-text" font-size="14">
      "In nature as in software: complex, living intelligence emerges from simple, elegant rules."
    </text>
    <text x="600" y="70" class="author-text" font-size="11.5" font-weight="500">
      CRAFTED BY <tspan fill="#a7f3d0" font-weight="700">NGUYEN ANH DUONG (DuongNAD)</tspan> · FPT UNIVERSITY · HANOI, VIETNAM
    </text>
  </g>
</svg>
