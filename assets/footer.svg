<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080F24" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="20%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="140" fill="url(#footer-bg)" rx="10" />

  <!-- Top Accent Laser Line -->
  <line x1="50" y1="20" x2="1150" y2="20" stroke="url(#footer-line)" stroke-width="1.5" filter="url(#f-glow)" />

  <!-- Center Diamond Indicator -->
  <polygon points="600,16 605,20 600,24 595,20" fill="#38BDF8" filter="url(#f-glow)" />

  <!-- Text -->
  <g transform="translate(600, 60)">
    <text x="0" y="0" text-anchor="middle" class="sans" font-size="14.5" font-weight="600" fill="#E2E8F0" letter-spacing="1">
      "Architecting autonomous cognitive intelligence &amp; scalable agentic infrastructure."
    </text>
  </g>

  <g transform="translate(600, 95)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="11.5" font-weight="500" fill="#64748B" letter-spacing="1.5">
      ENGINEERED BY <tspan fill="#38BDF8" font-weight="700">NGUYEN ANH DUONG (DuongNAD)</tspan> · HANOI, VIETNAM · 2026
    </text>
  </g>
</svg>
