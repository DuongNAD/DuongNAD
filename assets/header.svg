<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%" role="img" aria-label="Nguyen Anh Duong - Nature &amp; Living Systems Banner">
  <defs>
    <!-- Sky Gradient: Deep Nordic Twilight to Pine Horizon -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03080d" />
      <stop offset="28%" stop-color="#06181d" />
      <stop offset="60%" stop-color="#0b2e28" />
      <stop offset="85%" stop-color="#12443a" />
      <stop offset="100%" stop-color="#185246" />
    </linearGradient>

    <!-- Aurora Borealis Curving Ribbons -->
    <linearGradient id="auroraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="25%" stop-color="#059669" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#0d9488" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="auroraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0" />
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="68%" stop-color="#6ee7b7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0" />
    </linearGradient>

    <!-- Celestial Moon & Ambient Aurora Halo -->
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.95" />
      <stop offset="22%" stop-color="#a7f3d0" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="78%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Valley Mist Gradient -->
    <linearGradient id="valleyMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <!-- Bioluminescent Fireflies -->
    <radialGradient id="firefly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="1" />
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain Layers Gradients -->
    <linearGradient id="mtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#184a3f" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#123b32" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c2923" />
    </linearGradient>

    <linearGradient id="mtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#133a31" />
      <stop offset="60%" stop-color="#0c2721" />
      <stop offset="100%" stop-color="#061a15" />
    </linearGradient>

    <linearGradient id="mtnNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b241e" />
      <stop offset="100%" stop-color="#03100c" />
    </linearGradient>

    <!-- Foreground Forest Floor Base -->
    <linearGradient id="forestFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061813" />
      <stop offset="100%" stop-color="#020806" />
    </linearGradient>

    <!-- Subtle Emerald Top Border Line -->
    <linearGradient id="topBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <!-- Frosted Mist Backdrop for Typography -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03110e" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#020a08" stop-opacity="0.86" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.45" />
    </linearGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-weight: 700;
        fill: #f0fdf4;
        letter-spacing: 2.2px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-weight: 500;
        fill: #a7f3d0;
        letter-spacing: 0.6px;
      }
      .meta-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-weight: 400;
        fill: #6ee7b7;
        letter-spacing: 0.4px;
        opacity: 0.92;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-weight: 600;
        font-size: 9.5px;
        fill: #34d399;
        letter-spacing: 1.5px;
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.65; }
        50% { transform: translateY(-7px) scale(1.2); opacity: 1; }
      }
      .firefly-1 { animation: floatParticle 5s ease-in-out infinite; }
      .firefly-2 { animation: floatParticle 7s ease-in-out infinite reverse; }
    </style>
  </defs>

