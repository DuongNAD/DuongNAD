  <defs>
    <style>
      .bg { fill: #0B1220; rx: 8px; }
      .cell { width: 11px; height: 11px; rx: 2px; }
      .c0 { fill: #161F30; }
      .c1 { fill: #1E3A8A; }
      .c2 { fill: #2563EB; }
      .c3 { fill: #38BDF8; }
      .c4 { fill: #60A5FA; }
      @keyframes snakeMove {
        0% { transform: translate(0, 0); }
        25% { transform: translate(120px, 26px); }
        50% { transform: translate(340px, -13px); }
        75% { transform: translate(560px, 39px); }
        100% { transform: translate(750px, 0); }
      }
      .snake-body {
        animation: snakeMove 12s linear infinite alternate;
      }
    </style>
  </defs>

  <rect width="880" height="180" class="bg" />

